Name: ha-paneld
Summary: Universal Home Assistant dashboard app for Android wall panels

Description: |-
    ha-paneld turns an Android wall panel into a consistent, local Home Assistant dashboard and device across different hardware makes. It can display Home Assistant through its built-in renderer or the official Companion app, while MQTT auto-discovery exposes supported panel hardware without per-device YAML.

    Panel owners and hardware vendors can create, validate and share declarative YAML profiles for additional devices without rebuilding the app. Profiles can select only the drivers and capabilities already implemented by ha-paneld; they cannot add executable code or arbitrary privileged operations.

    * Screen control — brightness, true backlight-off, and wake-on-wave (proximity).
    * An on-screen soft navigation bar for panels whose firmware hides the native Android navigation controls.
    * On-board relays and button LEDs as Home Assistant switch and light entities, where the panel has them.
    * Sensors (ambient light, proximity, temperature / humidity) as entities.
    * Zigbee gateway control on panels with an on-board radio.
    * A local HTTP control and information surface with a per-panel Home Assistant device identity.

    Some capabilities require root access on the panel, while the dashboard renderers, MQTT, standard Android controls and HTTP features do not. See the project README for per-panel capabilities.

    Free, open source and fully local — no cloud and no account.

