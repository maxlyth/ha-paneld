version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      android-toolchain:
        patterns:
          - "com.android.application"
          - "org.jetbrains.kotlin:kotlin-gradle-plugin"
          - "androidx.core:*"
          - "gradle"
      kotlin-network-stack:
        patterns:
          - "io.ktor:*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines-*"
      mqtt-stack:
        patterns:
          - "com.hivemq:*"
          - "de.fraunhofer.iosb.io.moquette:*"
      android-test:
        patterns:
          - "androidx.test:*"
          - "androidx.test.ext:*"
          - "androidx.test.uiautomator:*"
    ignore:
      # Temporary: Kotlin 2.4.10's fully supported range ends at AGP 9.1. Remove these
      # exclusions when a stable Kotlin release supports newer AGP and the migration gates pass.
      - dependency-name: "com.android.application"
        versions:
          - "9.2.x"
          - "9.3.x"
      # Temporary: Engine 3 requires Java 11. Remove after its parser and emitter pass the
      # oldest-supported Android runtime gate; review any security advisory independently.
      - dependency-name: "org.snakeyaml:snakeyaml-engine"
        versions:
          - "3.x"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /test
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      ui-test-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /tools/profile-editor
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      profile-editor-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pip
    directory: /fdroid
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      fdroid-build-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
