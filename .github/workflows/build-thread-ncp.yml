name: Build Thread NCP firmware

# Builds an OpenThread NCP .gbl for the EFR32MG21A020F768IM32 (NSPanel Pro / ZBDongle-E family).
# Run manually: Actions → "Build Thread NCP firmware" → Run workflow.
#
# On first run, leave 'commit' false and check the artifact + "Discover" step logs
# to confirm the SLCP path and verify the built GBL size looks right (~200-280 KB for NCP).
# Then re-run with 'commit' true to land it in assets/.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Open PR to commit GBL into assets/ after build?'
        required: false
        default: 'false'
        type: boolean
      sdk_version:
        description: 'Gecko SDK version tag in Docker image (e.g. 4.4.6)'
        required: false
        default: '4.4.6'
        type: string

env:
  CHIP: EFR32MG21A020F768IM32
  BAUD: '115200'
  # UART flow control component config key.
  # usartHwFlowControlNone = no RTS/CTS (matches our spinel.c which clears CRTSCTS).
  FLOW: usartHwFlowControlNone
  ASSET_PATH: app/src/main/assets/firmware/efr32mg21-thread-ncp.gbl

jobs:
  build:
    name: Build OpenThread NCP GBL
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The silabs-firmware-builder image bundles the full Gecko SDK, slc-cli,
      # ARM GCC, and Simplicity Commander.  No licence required for public builds.
      - name: Pull builder image
        run: docker pull ghcr.io/darkxst/silabs-firmware-builder:${{ inputs.sdk_version }}

      # The ot-ncp-ftd.slcp is confirmed present in Gecko SDK 4.4.6 (and likely all 4.x).
      # ot-ncp-ftd = Full Thread Device NCP: full Thread stack on the EFR32, host talks Spinel.
      # This is what spinel.c expects. ot-rcp.slcp / rcp-uart-802154.slcp are NOT suitable.
      - name: Resolve NCP SLCP path
        id: discover
        run: |
          # Prefer the SDK root that exists in this image version.
          NCP_SLCP=$(docker run --rm \
            ghcr.io/darkxst/silabs-firmware-builder:${{ inputs.sdk_version }} \
            bash -c "
              for sdk in /gecko_sdk /simplicity_sdk; do
                f=\"\$sdk/protocol/openthread/sample-apps/ot-ncp/ot-ncp-ftd.slcp\"
                [ -f \"\$f\" ] && echo \"\$f\" && break
              done
            ")
          if [ -z "$NCP_SLCP" ]; then
            echo "::error::ot-ncp-ftd.slcp not found in SDK ${{ inputs.sdk_version }}. Try a different sdk_version."
            exit 1
          fi
          echo "ncp_slcp=${NCP_SLCP}" >> "$GITHUB_OUTPUT"
          echo "Using NCP SLCP: ${NCP_SLCP}"

      - name: Build GBL
        run: |
          mkdir -p build

          NCP_SLCP="${{ steps.discover.outputs.ncp_slcp }}"
          if [ -z "$NCP_SLCP" ]; then
            echo "::error::ot-ncp-ftd.slcp not found in SDK ${{ inputs.sdk_version }}."
            exit 1
          fi

          # The /build volume is owned by the runner (root); builder can't write to it.
          # Generate inside the container's home dir, then copy the GBL out at the end.
          docker run --rm \
            --user builder \
            -v "$(pwd)/build:/out" \
            ghcr.io/darkxst/silabs-firmware-builder:${{ inputs.sdk_version }} \
            bash -c "
              set -euo pipefail
              mkdir -p /home/builder/build

              echo '>>> Generating project from: ${NCP_SLCP}'
              slc generate \
                --with='${{ env.CHIP }}' \
                --project-file='${NCP_SLCP}' \
                --export-destination=/home/builder/build/ot-ncp \
                --copy-proj-sources \
                --copy-sdk-sources \
                --new-project \
                --force \
                --output-type vscode \
                --toolchain toolchain_gcc

              echo '>>> Generated files in /home/builder/build/ot-ncp:'
              ls /home/builder/build/ot-ncp/

              echo '>>> Config files (for UART pin/baud patching):'
              find /home/builder/build/ot-ncp/config -name '*.h' 2>/dev/null | sort

              CFG_IOSTREAM=/home/builder/build/ot-ncp/config/sl_iostream_usart_vcom_config.h
              CFG_UARTDRV=/home/builder/build/ot-ncp/config/sl_uartdrv_usart_vcom_config.h

              patch_uart() {
                local f=\$1
                [ -f \"\$f\" ] || return 0
                echo \">>> Patching UART config: \$f\"
                # TX → Port B pin 1
                sed -i 's/define SL_.*_TX_PORT.*gpioPort.*/define SL_IOSTREAM_USART_VCOM_TX_PORT gpioPortB/' \"\$f\" 2>/dev/null || true
                sed -i 's/define SL_.*_TX_PORT.*gpioPort.*/define SL_UARTDRV_USART_VCOM_TX_PORT gpioPortB/' \"\$f\" 2>/dev/null || true
                sed -i 's/define SL_.*_TX_PIN.*/define SL_IOSTREAM_USART_VCOM_TX_PIN 1/' \"\$f\" 2>/dev/null || true
                sed -i 's/define SL_.*_TX_PIN.*/define SL_UARTDRV_USART_VCOM_TX_PIN 1/' \"\$f\" 2>/dev/null || true
                # RX → Port B pin 0
                sed -i 's/define SL_.*_RX_PORT.*gpioPort.*/define SL_IOSTREAM_USART_VCOM_RX_PORT gpioPortB/' \"\$f\" 2>/dev/null || true
                sed -i 's/define SL_.*_RX_PORT.*gpioPort.*/define SL_UARTDRV_USART_VCOM_RX_PORT gpioPortB/' \"\$f\" 2>/dev/null || true
                sed -i 's/define SL_.*_RX_PIN.*/define SL_IOSTREAM_USART_VCOM_RX_PIN 0/' \"\$f\" 2>/dev/null || true
                sed -i 's/define SL_.*_RX_PIN.*/define SL_UARTDRV_USART_VCOM_RX_PIN 0/' \"\$f\" 2>/dev/null || true
                # Baud rate → 115200; disable hardware flow control
                sed -i 's/\(define SL_IOSTREAM_USART_VCOM_BAUDRATE\) [0-9]*/\1 ${{ env.BAUD }}/' \"\$f\" 2>/dev/null || true
                sed -i 's/\(define SL_UARTDRV_USART_VCOM_BAUDRATE\) [0-9]*/\1 ${{ env.BAUD }}/' \"\$f\" 2>/dev/null || true
                sed -i 's/\(define SL_.*FLOW_CONTROL_TYPE\).*/\1 usartHwFlowControlNone/' \"\$f\" 2>/dev/null || true
              }
              patch_uart \"\$CFG_IOSTREAM\"
              patch_uart \"\$CFG_UARTDRV\"

              cd /home/builder/build/ot-ncp

              # Build with cmake + Ninja (matches --output-type vscode generation).
              cmake -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake \
                    -G Ninja . 2>/dev/null \
                || cmake -DCMAKE_BUILD_TYPE=Release -G Ninja .
              cmake --build . -- -j\$(nproc)

              # Find ELF output
              ELF=\$(find . -name '*.out' -o -name '*.elf' 2>/dev/null \
                    | grep -v bootloader | head -1)
              echo \">>> ELF: \$ELF  size: \$(ls -lh \"\$ELF\" | awk '{print \$5}')\"

              commander gbl create /home/builder/build/efr32mg21-thread-ncp.gbl \
                --app \"\$ELF\" \
                --device '${{ env.CHIP }}'

              ls -lh /home/builder/build/efr32mg21-thread-ncp.gbl

              # Copy GBL to the mounted output volume
              cp /home/builder/build/efr32mg21-thread-ncp.gbl /out/efr32mg21-thread-ncp.gbl
            "

          # Sanity check: NCP firmware should be 150-320 KB (RCP is ~100 KB, Zigbee NCP is ~240 KB).
          SIZE=$(stat -c%s build/efr32mg21-thread-ncp.gbl)
          echo "GBL size: ${SIZE} bytes"
          if [ "$SIZE" -lt 131072 ] || [ "$SIZE" -gt 393216 ]; then
            echo "::warning::GBL size ${SIZE} is outside expected 128-384 KB range for NCP firmware."
          fi

      - name: Upload GBL artifact
        uses: actions/upload-artifact@v4
        with:
          name: efr32mg21-thread-ncp-sdk${{ inputs.sdk_version }}
          path: build/efr32mg21-thread-ncp.gbl
          if-no-files-found: error

      # Open a PR so the maintainer can review the binary before it lands in the repo.
      - name: Open PR with firmware asset
        if: ${{ inputs.commit == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="feat/thread-ncp-firmware-sdk${{ inputs.sdk_version }}-$(date +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          mkdir -p "$(dirname "${{ env.ASSET_PATH }}")"
          cp build/efr32mg21-thread-ncp.gbl "${{ env.ASSET_PATH }}"
          git add "${{ env.ASSET_PATH }}"

          # Avoid heredocs (zero-indent content breaks YAML literal blocks).
          COMMIT_MSG="feat(thread): add OpenThread NCP GBL for ${{ env.CHIP }}"$'\n\n'"Built from Gecko SDK ${{ inputs.sdk_version }}, ${{ env.BAUD }} baud, no hardware flow control."$'\n'"Firmware asset for the Thread Mesh Router feature on NSPanel Pro panels."
          git commit -m "$COMMIT_MSG"

          git push origin "$BRANCH"

          # Build PR body as a file — avoids nested quote/heredoc issues in YAML.
          PR_BODY=/tmp/pr-body.md
          echo "## Thread NCP firmware asset" > "$PR_BODY"
          echo "" >> "$PR_BODY"
          echo "Adds the OpenThread NCP GBL built by the \`build-thread-ncp\` workflow." >> "$PR_BODY"
          echo "" >> "$PR_BODY"
          echo "**Target chip:** \`${{ env.CHIP }}\` (NSPanel Pro 86P/120P EFR32 — same as ZBDongle-E family)" >> "$PR_BODY"
          echo "**SDK version:** ${{ inputs.sdk_version }}" >> "$PR_BODY"
          echo "**Baud rate:** ${{ env.BAUD }}" >> "$PR_BODY"
          echo "**Flow control:** none (matches \`spinel.c\`)" >> "$PR_BODY"
          echo "" >> "$PR_BODY"
          echo "**Verify before merging:**" >> "$PR_BODY"
          echo "- [ ] GBL size 150-280 KB (expected for NCP; if ~105 KB it built as RCP instead)" >> "$PR_BODY"
          echo "- [ ] Strings in GBL contain \`ot-ncp\` not \`ot-rcp\`" >> "$PR_BODY"
          echo "- [ ] Flash tested on a spare NSPanel Pro and Spinel commissioning verified" >> "$PR_BODY"

          gh pr create \
            --title "feat(thread): OpenThread NCP firmware for ${{ env.CHIP }}" \
            --body-file "$PR_BODY" \
            --head "$BRANCH" \
            --base "${{ github.event.repository.default_branch }}"
