# Non-blocking layout-stability (CLS) report. NEVER gates a build/merge — it posts a job summary that
# flags regressions vs test/baseline.json and lists high-CLS cells as backlog. See test/README.md.
name: UI layout (CLS) · report-only
run-name: UI layout · ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
    paths: ['app/src/main/assets/**', 'test/**', '.github/workflows/ui-layout.yml']
  pull_request:
    paths: ['app/src/main/assets/**', 'test/**', '.github/workflows/ui-layout.yml']
  workflow_dispatch:

# A push supersedes the run before it, so group by ref and let the newer run
# cancel the older one. Keying a push on its own run id gave every push a group
# of one, so superseded runs kept burning minutes to no purpose.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install playwright-core
        run: cd test && npm ci --ignore-scripts
      - name: Test CLS sampling policy
        run: cd test && npm test
      - name: Run CLS matrix (report-only)
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -x "$CHROME"
          CHROME="$CHROME" node test/layout-matrix.mjs | tee -a "$GITHUB_STEP_SUMMARY"
