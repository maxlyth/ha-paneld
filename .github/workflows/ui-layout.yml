# Non-blocking layout-stability (CLS) report. NEVER gates a build/merge — it posts a job summary that
# flags regressions vs test/baseline.json and lists high-CLS cells as backlog. See test/README.md.
name: UI layout (CLS) · report-only
run-name: UI layout · ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
    paths: ['app/src/main/assets/**', 'test/**', '.github/workflows/ui-layout.yml']
  pull_request:
    paths: ['app/src/main/assets/**', 'test/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cls:
    runs-on: ubuntu-24.04
    continue-on-error: true   # report-only — must never block development
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install playwright-core
        run: cd test && npm ci --ignore-scripts
      - name: Run CLS matrix (report-only)
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -x "$CHROME"
          CHROME="$CHROME" node test/layout-matrix.mjs | tee -a "$GITHUB_STEP_SUMMARY"
