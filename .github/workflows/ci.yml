name: CI
run-name: CI · ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enforce GitHub Actions policy
        shell: bash
        run: |
          failed=0
          while IFS= read -r ref; do
            if [[ "$ref" == ./* || "$ref" =~ @[0-9a-f]{40}$ ]]; then
              continue
            fi
            echo "::error::GitHub Action reference is not a full commit SHA: $ref"
            failed=1
          done < <(sed -nE 's/^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*([^[:space:]#]+).*/\1/p' .github/workflows/*.yml)
          while IFS=: read -r file line _; do
            if ! sed -n "${line},$((line + 2))p" "$file" | grep -Eq '^[[:space:]]+cache-provider:[[:space:]]+basic([[:space:]]*(#.*)?)?$'; then
              echo "::error file=$file,line=$line::setup-gradle must select the open-source basic cache provider"
              failed=1
            fi
          done < <(grep -nHE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*gradle/actions/setup-gradle@' .github/workflows/*.yml)
          exit "$failed"

      # The info-page front-end is a static asset (not embedded in a Kotlin string), so its syntax
      # is checkable. `node --check` catches JS syntax errors (e.g. an apostrophe in a single-quoted
      # string) that the Kotlin build would otherwise pass straight through. Fails fast, before Gradle.
      - name: Validate front-end assets
        run: |
          find app/src/main/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find app/src/main/assets -type f -name '*.json' -print0 | xargs -0 -n1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))'

      - name: Set up Node.js for the embedded profile editor
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.18.1'
          cache: npm
          cache-dependency-path: tools/profile-editor/package-lock.json

      - name: Verify the embedded profile editor and runtime inventory
        working-directory: tools/profile-editor
        run: |
          npm ci --ignore-scripts --audit=false --fund=false
          npm run check
          npm run sbom

      - name: Test firmware index tooling
        run: python3 -m unittest discover -s tools/firmware-index -p 'test_*.py' -v

      - name: Test host-side shell contracts
        run: |
          scripts/tests/provision_test.sh
          scripts/tests/hardware_collector_test.sh

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK + CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Test, lint, and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ha-paneld-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # The root helper (helper/src/) is C, never touched by the Gradle build. This job is the only place
  # it's compiler-checked and unit-tested — host-native (gcc), so it's fast and needs no NDK. The parser
  # sanitizer smoke (helper/fuzz/run.sh) is deliberately NOT run here: it is deterministic rather than
  # coverage-guided and is run locally when the parser, dispatch, or validators change.
  helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Compile check (-Werror)
        run: make -C helper

      - name: Unit tests
        run: make -C helper test

      - name: App↔daemon contract cross-check
        run: helper/test/contract-check.sh
