name: CI
run-name: CI · ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The info-page front-end is a static asset (not embedded in a Kotlin string), so its syntax
      # is checkable. `node --check` catches JS syntax errors (e.g. an apostrophe in a single-quoted
      # string) that the Kotlin build would otherwise pass straight through. Fails fast, before Gradle.
      - name: Lint front-end JS
        run: node --check app/src/main/assets/info.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ha-paneld-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # The root helper (helper/src/) is C, never touched by the Gradle build. This job is the only place
  # it's compiler-checked, unit-tested, and fuzzed — host-native (gcc), so it's fast and needs no NDK.
  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile check (-Werror)
        run: make -C helper

      - name: Unit tests
        run: make -C helper test

      - name: Parser fuzz (ASan+UBSan+LSan, bounded)
        run: ./helper/fuzz/run.sh 200000
