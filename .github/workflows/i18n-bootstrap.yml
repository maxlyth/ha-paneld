name: Future-locale translation bootstrap
run-name: Future-locale bootstrap · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      locales:
        description: Comma-separated review-only target locales
        required: true
        default: nl,pl,uk

permissions:
  contents: read

concurrency:
  group: future-locale-bootstrap-main
  cancel-in-progress: false

jobs:
  bootstrap:
    name: DeepL review-only candidates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare immutable bootstrap plan
        env:
          REQUESTED_LOCALES: ${{ inputs.locales }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          IFS=',' read -ra requested <<<"$REQUESTED_LOCALES"
          declare -A seen=()
          locale_args=()
          for locale in "${requested[@]}"; do
            case "$locale" in
              nl|pl|uk|cs|pt-BR) ;;
              *) echo "::error::Unsupported bootstrap locale selection"; exit 1 ;;
            esac
            if [[ -n "${seen[$locale]:-}" ]]; then
              echo "::error::Duplicate locale selection"
              exit 1
            fi
            seen[$locale]=1
            locale_args+=(--locale "$locale")
          done
          if [[ ${#locale_args[@]} -eq 0 ]]; then
            echo "::error::At least one locale is required"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/i18n-bootstrap"
          python3 scripts/i18n_deepl_bootstrap.py plan \
            --source app/src/main/assets/i18n/en.json \
            --base-revision "$GITHUB_SHA" \
            "${locale_args[@]}" \
            --output "$RUNNER_TEMP/i18n-bootstrap/plan.json"

      - name: Verify adapter and exact source input
        run: |
          set -euo pipefail
          python3 -m unittest scripts.tests.i18n_deepl_test scripts.tests.i18n_deepl_bootstrap_test
          python3 scripts/i18n_deepl_bootstrap.py validate-inputs \
            --plan "$RUNNER_TEMP/i18n-bootstrap/plan.json" \
            --source app/src/main/assets/i18n/en.json

      - name: Reject stale trusted base before provider access
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 scripts/i18n_deepl.py check-base \
            --expected "$GITHUB_SHA" \
            --repository . \
            --remote-ref origin/main

      - name: Generate review-only candidates after quota preflight
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/i18n_deepl_bootstrap.py generate \
            --plan "$RUNNER_TEMP/i18n-bootstrap/plan.json" \
            --source app/src/main/assets/i18n/en.json \
            --output-dir "$RUNNER_TEMP/i18n-bootstrap/generated"

      - name: Recheck trusted base before publication
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 scripts/i18n_deepl.py check-base \
            --expected "$GITHUB_SHA" \
            --repository . \
            --remote-ref origin/main

      - name: Upload review-only bootstrap candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: future-locale-bootstrap-${{ github.sha }}
          path: ${{ runner.temp }}/i18n-bootstrap/generated
          if-no-files-found: error
          retention-days: 7
