name: Shizuku emulator
run-name: Shizuku emulator · ${{ github.head_ref || github.ref_name }}

# Slow, dependency-specific integration coverage. Kept separate from the normal CI/release gate so
# work toward 0.9.3 cannot impede the current release-candidate initiative.
on:
  pull_request:
    paths:
      - 'app/src/main/**/shizuku/**'
      - 'app/src/androidTest/**/shizuku/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/kotlin/io/github/maxlyth/hapaneld/ConfigActivity.kt'
      - 'app/src/main/kotlin/io/github/maxlyth/hapaneld/HaPaneldApp.kt'
      - 'app/src/main/kotlin/io/github/maxlyth/hapaneld/PaneldService.kt'
      - 'app/src/main/kotlin/io/github/maxlyth/hapaneld/control/DensityController.kt'
      - 'app/src/main/kotlin/io/github/maxlyth/hapaneld/control/InteractiveController.kt'
      - 'app/src/main/kotlin/io/github/maxlyth/hapaneld/http/PaneldServer.kt'
      - 'app/src/main/kotlin/io/github/maxlyth/hapaneld/platform/ShellPrivilege.kt'
      - 'app/src/main/kotlin/io/github/maxlyth/hapaneld/util/AppInstaller.kt'
      - 'app/src/main/kotlin/io/github/maxlyth/hapaneld/util/CompanionInstaller.kt'
      - 'app/src/main/kotlin/io/github/maxlyth/hapaneld/util/SelfUpdater.kt'
      - 'app/src/main/kotlin/io/github/maxlyth/hapaneld/util/WebViewInstaller.kt'
      - 'scripts/provision.sh'
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/shizuku-emulator.yml'
  workflow_dispatch:

jobs:
  integration:
    name: API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [27, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Install build SDK, NDK, and emulator image
        run: sdkmanager "platform-tools" "platforms;android-35" "system-images;android-${{ matrix.api-level }};google_apis;x86_64" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Download curated Shizuku manager
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' \
            'https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk' \
            -o "$RUNNER_TEMP/shizuku.apk"
          echo '6e273ab0e991c4e79bc8b1bbb9b9dd739ccac1a8712a541a214078886b7b790f  '"$RUNNER_TEMP/shizuku.apk" | sha256sum -c -

      - name: Build app and instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Exercise real Shizuku Binder and APK update path
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/shizuku.apk"
            adb shell monkey -p moe.shizuku.privileged.api 1
            for i in $(seq 1 20); do
              adb shell test -f /storage/emulated/0/Android/data/moe.shizuku.privileged.api/start.sh && break
              sleep 1
            done
            adb shell sh /storage/emulated/0/Android/data/moe.shizuku.privileged.api/start.sh
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb push "$RUNNER_TEMP/shizuku.apk" /data/local/tmp/shizuku.apk
            adb shell run-as io.github.maxlyth.hapaneld cp /data/local/tmp/shizuku.apk files/shizuku-test.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w \
              -e managerApk /data/user/0/io.github.maxlyth.hapaneld/files/shizuku-test.apk \
              -e class io.github.maxlyth.hapaneld.shizuku.ShizukuIntegrationTest \
              io.github.maxlyth.hapaneld.test/androidx.test.runner.AndroidJUnitRunner
