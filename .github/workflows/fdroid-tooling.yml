name: F-Droid tooling
run-name: F-Droid tooling · ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - fdroid/requirements.in
      - fdroid/requirements.txt
      - fdroid/build-requirements.in
      - fdroid/build-requirements.txt
      - .github/workflows/fdroid.yml
      - .github/workflows/fdroid-tooling.yml
  pull_request:
    branches: [main]
    paths:
      - fdroid/requirements.in
      - fdroid/requirements.txt
      - fdroid/build-requirements.in
      - fdroid/build-requirements.txt
      - .github/workflows/fdroid.yml
      - .github/workflows/fdroid-tooling.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install hash-locked F-Droid tooling
        run: |
          python -m pip install --require-hashes -r fdroid/build-requirements.txt
          python -m pip install --require-hashes --no-build-isolation -r fdroid/requirements.txt

      - name: Verify installed F-Droid version
        run: |
          expected="$(sed -nE 's/^fdroidserver==([^[:space:]\\]+).*/\1/p' fdroid/requirements.in)"
          test -n "$expected"
          test "$(fdroid --version)" = "$expected"
