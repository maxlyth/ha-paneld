name: Shelly firmware monitor
run-name: Shelly firmware monitor · ${{ github.event_name }}

# Poll Shelly Wall Display OTA manifest endpoints daily, detect new firmware
# versions, and immediately archive them to the Wayback Machine before Shelly
# replaces the CDN object in-place (old versions go 404 on the next release).
#
# On a scheduled run or a manual `update` run: appends the entry to
# fw-shelly-walldisplay.dat, submits the firmware URL to Save Page Now, confirms
# the capture, and commits the updated .dat back to main. The Discussion is
# updated whenever .dat changes. Manual runs default to read-only verification.
#
# Daily cadence is sufficient: Shelly rolls firmware out to the fleet over days
# rather than pushing a rapid patch cycle, so a daily poll gives ample time to
# archive each version before the next one replaces it on the CDN.
#
# Secrets required:
#   WAYBACK_S3          "accesskey:secret" from archive.org/account/s3.php
#   DISCUSSIONS_TOKEN   fine-grained PAT with Discussions: Read and write
#
# After creating Discussion #N for the Shelly archive, set SHELLY_DISCUSSION_NUMBER below.

on:
  schedule:
    - cron: "47 9 * * *"   # daily at 09:47 UTC (after the NSPanel Pro monitor at 08:23)
  workflow_dispatch:
    inputs:
      mode:
        description: Verify only, or run the publishing/update path
        required: true
        type: choice
        default: verify
        options:
          - verify
          - update

permissions:
  contents: read

concurrency:
  group: shelly-firmware-monitor
  cancel-in-progress: false

env:
  DAT: tools/firmware-index/fw-shelly-walldisplay.dat
  SHELLY_DISCUSSION_NUMBER: "14"

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Fetch and validate both manifests and CDN objects in the ephemeral
      # checkout. This job has no write token, publishing secrets, or post steps.
      - name: Verify Shelly manifests and TLS trust
        run: python tools/firmware-index/shelly_firmware.py verify

  monitor:
    if: github.event_name == 'schedule' || inputs.mode == 'update'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write       # commit new .dat entries to main
    outputs:
      has_new: ${{ steps.probe.outputs.has_new }}
      has_pending: ${{ steps.probe.outputs.has_pending }}
      new_versions: ${{ steps.probe.outputs.new_versions }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Check both manifest endpoints for new versions. Sets has_new, has_pending,
      # new_versions in GITHUB_OUTPUT; appends new entries to the .dat file.
      - name: Check Shelly manifests
        id: probe
        run: python tools/firmware-index/shelly_firmware.py probe --dat "$DAT"

      # Archive any unarchived CDN URLs. Runs when there are new versions OR when
      # a prior run left archival pending (e.g. SPN was slow to confirm). The
      # archive step fills in wayback_ts in the .dat file.
      - name: Archive to Wayback Machine
        if: steps.probe.outputs.has_new == 'true' || steps.probe.outputs.has_pending == 'true'
        env:
          WAYBACK_S3: ${{ secrets.WAYBACK_S3 }}
        run: python tools/firmware-index/shelly_firmware.py archive --dat "$DAT"

      # Detect whether the .dat file actually changed (new entry or wayback_ts filled in).
      - name: Check for .dat changes
        id: diff
        run: |
          if git diff --quiet "$DAT"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Render the Discussion body whenever .dat changed OR on manual dispatch (to
      # allow re-rendering without a firmware update, e.g. after filling wayback_ts).
      - name: Render Discussion body
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: python tools/firmware-index/shelly_firmware.py render --dat "$DAT" --out body.md

      - name: Update Discussion
        if: (steps.diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && env.SHELLY_DISCUSSION_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.DISCUSSIONS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::DISCUSSIONS_TOKEN not set — skipping Discussion update."
            exit 0
          fi
          owner="${GITHUB_REPOSITORY%/*}"; name="${GITHUB_REPOSITORY#*/}"
          did=$(gh api graphql \
            -f query='query($o:String!,$n:String!,$num:Int!){repository(owner:$o,name:$n){discussion(number:$num){id}}}' \
            -f o="$owner" -f n="$name" -F num="${SHELLY_DISCUSSION_NUMBER}" \
            --jq '.data.repository.discussion.id')
          test -n "$did" || { echo "could not resolve discussion #${SHELLY_DISCUSSION_NUMBER}"; exit 1; }
          gh api graphql \
            -f query='mutation($id:ID!,$b:String!){updateDiscussion(input:{discussionId:$id,body:$b}){discussion{url updatedAt}}}' \
            -f id="$did" -F b=@body.md

      # Commit updated .dat back to main. Includes [skip ci] so the Android build
      # does not fire on a data-file-only commit.
      - name: Commit updated firmware index
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSIONS: ${{ steps.probe.outputs.new_versions }}
        run: |
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DAT"
          msg="data: Shelly Wall Display firmware index update"
          if [ -n "$NEW_VERSIONS" ]; then
            msg="data: Shelly Wall Display $NEW_VERSIONS discovered"
          fi
          git commit -m "${msg} [skip ci]"
          # Rebase in case a parallel run pushed first (rare but possible with manual runs).
          git pull --rebase "$repo_url" main
          git push "$repo_url" HEAD:main
