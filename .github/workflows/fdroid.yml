name: F-Droid repo
run-name: F-Droid repo · ${{ github.event.workflow_run.head_branch || github.event_name }}

# Republishes the release-signed APKs from GitHub Releases as a self-hosted F-Droid repository on
# GitHub Pages. STATELESS: every run rebuilds the repo from the current set of release-key-signed *full*
# GitHub Releases, so the served APK is byte-identical to the release asset and the F-Droid client can
# update panels in place. Pre-releases (…-rcN) and legacy debug-key releases are intentionally excluded.
#
# ONE-TIME SETUP (maintainer):
#   1. Settings -> Pages -> Source = "GitHub Actions".
#   2. The ANDROID_KEYSTORE_* secrets that sign the release APKs (see release.yml) are currently reused
#      to preserve the repository fingerprint already pinned by clients. The workflow refuses any
#      unexpected key rather than silently rotating that public identity.
#   3. After the first successful run, grab the repo fingerprint from the run log / landing page and
#      share the add-repo URL:  https://maxlyth.github.io/ha-paneld/fdroid/repo?fingerprint=<FP>

on:
  # Chain after the Release workflow. We can't use `on: release` — a release created by another
  # workflow's GITHUB_TOKEN does not emit triggering events, so that would never fire. `workflow_run`
  # fires regardless of how the upstream run was triggered.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch: {}      # manual rebuild / first population

permissions:
  contents: read

concurrency:
  group: fdroid-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: release
    # Run after a successful Release for a FULL version tag (skip rc Release runs, e.g. v0.8.2-rc5);
    # always allow a manual dispatch. head_branch on a tag-push run is the tag name.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !contains(github.event.workflow_run.head_branch, '-'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Guard — signing secrets present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::ANDROID_KEYSTORE_* secrets are required to sign the F-Droid index."
              exit 1
            fi
          done

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install build-tools + fdroidserver
        run: |
          sdkmanager "build-tools;34.0.0"
          python -m pip install --require-hashes -r fdroid/build-requirements.txt
          python -m pip install --require-hashes --no-build-isolation -r fdroid/requirements.txt

      - name: Download released (non-prerelease) APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fdroid/repo
          mapfile -t tags < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease,isDraft \
            --jq '.[] | select(.isPrerelease==false and .isDraft==false) | .tagName')
          echo "Full releases: ${tags[*]:-<none>}"
          for tag in "${tags[@]}"; do
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Skipping non-app release tag: $tag"
              continue
            fi
            case "$tag" in
              v0.3.0|v0.4.0|v0.4.1|v0.4.2)
                echo "Skipping legacy debug-key app release: $tag"
                continue
                ;;
            esac

            asset_names="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name')"
            canonical_assets=()
            for candidate in \
              "ha-paneld-${tag}-manual-setup-required.apk" \
              "ha-paneld-${tag}.apk"; do
              if grep -Fxq "$candidate" <<< "$asset_names"; then
                canonical_assets+=("$candidate")
              fi
            done
            if [ "${#canonical_assets[@]}" -ne 1 ]; then
              echo "::error::Release $tag must contain exactly one canonical ha-paneld APK; found ${#canonical_assets[@]}."
              exit 1
            fi

            apk_name="${canonical_assets[0]}"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$apk_name" --dir fdroid/repo
            test -s "fdroid/repo/$apk_name"
          done
          ls -la fdroid/repo
          shopt -s nullglob
          apks=(fdroid/repo/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No full-release APKs found to publish."
            exit 1
          fi

      - name: Authenticate every APK before indexing
        env:
          EXPECTED_PACKAGE: io.github.maxlyth.hapaneld
          EXPECTED_SIGNER_SHA256: ac6193307fb0b70113aae205d7549406f96e063bc5491b67b1d5694a34b0e339
        run: |
          build_tools="$ANDROID_HOME/build-tools/34.0.0"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          shopt -s nullglob
          apks=(fdroid/repo/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APKs are available for authentication."
            exit 1
          fi

          for apk in "${apks[@]}"; do
            apk_name="${apk##*/}"
            tag="${apk_name#ha-paneld-}"
            tag="${tag%-manual-setup-required.apk}"
            tag="${tag%.apk}"
            expected_version="${tag#v}"

            signer_output="$("$build_tools/apksigner" verify --verbose --print-certs "$apk")"
            mapfile -t signer_digests < <(
              sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest: ([0-9A-Fa-f:]+)$/\1/p' \
                <<< "$signer_output" | tr -d ':' | tr '[:upper:]' '[:lower:]'
            )
            if [ "${#signer_digests[@]}" -ne 1 ] || [ "${signer_digests[0]}" != "$EXPECTED_SIGNER_SHA256" ]; then
              echo "::error file=$apk::Unexpected APK signing certificate."
              exit 1
            fi

            badging="$("$build_tools/aapt" dump badging "$apk")"
            package_name="$(sed -nE "s/^package: name='([^']+)'.*/\1/p" <<< "$badging" | head -n 1)"
            version_name="$(sed -nE "s/^package: .* versionName='([^']+)'.*/\1/p" <<< "$badging" | head -n 1)"
            if [ "$package_name" != "$EXPECTED_PACKAGE" ]; then
              echo "::error file=$apk::Unexpected package name: ${package_name:-<missing>}"
              exit 1
            fi
            if [ "$version_name" != "$expected_version" ]; then
              echo "::error file=$apk::Version ${version_name:-<missing>} does not match release tag $tag."
              exit 1
            fi
            echo "Authenticated $apk_name ($package_name $version_name; signer $EXPECTED_SIGNER_SHA256)."
          done

      - name: Inject signing + SDK config (runtime only — never committed)
        working-directory: fdroid
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_REPO_FINGERPRINT: ac6193307fb0b70113aae205d7549406f96e063bc5491b67b1d5694a34b0e339
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          repo_fingerprint="$(
            keytool -exportcert -keystore "$RUNNER_TEMP/ks.jks" -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" 2>/dev/null |
              openssl dgst -sha256 | awk '{print $NF}' | tr '[:upper:]' '[:lower:]'
          )"
          if [ "$repo_fingerprint" != "$EXPECTED_REPO_FINGERPRINT" ]; then
            echo "::error::The configured repository key does not match the published F-Droid fingerprint; refusing to rotate clients silently."
            exit 1
          fi
          {
            echo "sdk_path: $ANDROID_HOME"
            echo "keystore: $RUNNER_TEMP/ks.jks"
            echo "repo_keyalias: $KEY_ALIAS"
            echo "repo_key_sha256: $EXPECTED_REPO_FINGERPRINT"
            echo "keystorepass: $KEYSTORE_PASSWORD"
            echo "keypass: $KEY_PASSWORD"
          } >> config.yml

      - name: Build + sign the repo index
        working-directory: fdroid
        run: fdroid update --create-metadata --pretty --verbose

      - name: Assemble Pages site (+ inject repo fingerprint into landing page)
        working-directory: fdroid
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # The F-Droid repo fingerprint is the SHA-256 of the signing certificate (DER), lowercase hex.
          FP=$(keytool -exportcert -keystore "$RUNNER_TEMP/ks.jks" -alias "$KEY_ALIAS" \
                -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | openssl dgst -sha256 | awk '{print $NF}')
          echo "Repo fingerprint: $FP"
          echo "Add-repo URL: https://maxlyth.github.io/ha-paneld/fdroid/repo?fingerprint=$FP"
          mkdir -p ../_site/fdroid
          cp -r repo ../_site/fdroid/repo
          sed "s|@FINGERPRINT@|$FP|g" site-index.html > ../_site/index.html

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/ks.jks" fdroid/config.yml

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
