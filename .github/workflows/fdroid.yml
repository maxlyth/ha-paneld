name: F-Droid repo
run-name: F-Droid repo · ${{ github.event.workflow_run.head_branch || github.event_name }}

# Republishes the release-signed APKs from GitHub Releases as a self-hosted F-Droid repository on
# GitHub Pages. STATELESS: every run rebuilds the repo from the current set of *full* GitHub Releases,
# so the served APK is byte-identical to the release asset (same signing key) and the F-Droid client can
# update panels in place. Pre-releases (…-rcN) are intentionally excluded.
#
# ONE-TIME SETUP (maintainer):
#   1. Settings -> Pages -> Source = "GitHub Actions".
#   2. The ANDROID_KEYSTORE_* secrets that sign the release APKs (see release.yml) are reused here to
#      sign the repo index, so the repo's identity == the app signing certificate. No new secrets.
#   3. After the first successful run, grab the repo fingerprint from the run log / landing page and
#      share the add-repo URL:  https://maxlyth.github.io/ha-paneld/fdroid/repo?fingerprint=<FP>

on:
  # Chain after the Release workflow. We can't use `on: release` — a release created by another
  # workflow's GITHUB_TOKEN does not emit triggering events, so that would never fire. `workflow_run`
  # fires regardless of how the upstream run was triggered.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch: {}      # manual rebuild / first population

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: fdroid-pages
  cancel-in-progress: true

jobs:
  pick:
    uses: ./.github/workflows/_pick-runner.yml
    secrets: inherit

  build:
    name: Build (${{ needs.pick.outputs.tier }})
    needs: pick
    runs-on: ${{ fromJson(needs.pick.outputs.labels) }}
    # Run after a successful Release for a FULL version tag (skip rc Release runs, e.g. v0.8.2-rc5);
    # always allow a manual dispatch. head_branch on a tag-push run is the tag name.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !contains(github.event.workflow_run.head_branch, '-'))
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — signing secrets present
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_* secrets are required to sign the F-Droid index."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install build-tools + fdroidserver
        run: |
          sdkmanager "build-tools;34.0.0"
          pip install --upgrade pip
          pip install fdroidserver

      - name: Download released (non-prerelease) APKs
        run: |
          mkdir -p fdroid/repo
          mapfile -t tags < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease,isDraft \
            --jq '.[] | select(.isPrerelease==false and .isDraft==false) | .tagName')
          echo "Full releases: ${tags[*]:-<none>}"
          for tag in "${tags[@]}"; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern '*.apk' --dir fdroid/repo --skip-existing || true
          done
          ls -la fdroid/repo
          if [ -z "$(ls -A fdroid/repo/*.apk 2>/dev/null)" ]; then
            echo "::error::No full-release APKs found to publish."
            exit 1
          fi

      - name: Inject signing + SDK config (runtime only — never committed)
        working-directory: fdroid
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          {
            echo "sdk_path: $ANDROID_HOME"
            echo "keystore: $RUNNER_TEMP/ks.jks"
            echo "repo_keyalias: $KEY_ALIAS"
            echo "keystorepass: $KEYSTORE_PASSWORD"
            echo "keypass: $KEY_PASSWORD"
          } >> config.yml

      - name: Build + sign the repo index
        working-directory: fdroid
        run: fdroid update --create-metadata --pretty --verbose

      - name: Assemble Pages site (+ inject repo fingerprint into landing page)
        working-directory: fdroid
        run: |
          # The F-Droid repo fingerprint is the SHA-256 of the signing certificate (DER), lowercase hex.
          FP=$(keytool -exportcert -keystore "$RUNNER_TEMP/ks.jks" -alias "$KEY_ALIAS" \
                -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | openssl dgst -sha256 | awk '{print $NF}')
          echo "Repo fingerprint: $FP"
          echo "Add-repo URL: https://maxlyth.github.io/ha-paneld/fdroid/repo?fingerprint=$FP"
          mkdir -p ../_site/fdroid
          cp -r repo ../_site/fdroid/repo
          sed "s|@FINGERPRINT@|$FP|g" site-index.html > ../_site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploy stays on ubuntu-latest — GitHub's deploy-pages action authenticates to the Pages
  # environment via OIDC and the integration with the github-pages environment is most reliable
  # on the hosted runner. Step is short (~20s) so there's no meaningful perf win in moving it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
