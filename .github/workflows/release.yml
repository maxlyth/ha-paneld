name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Set these repo secrets to publish a properly-signed release APK. Absent them, the
      # workflow falls back to the debug-signed APK so a tag still produces an installable asset.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build debug APK (fallback asset)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Sign release APK
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk)
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/ha-paneld-release-signed.apk \
            "$UNSIGNED"

      - name: Collect release asset
        id: asset
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/ha-paneld-release-signed.apk ]; then
            cp app/build/outputs/apk/release/ha-paneld-release-signed.apk "dist/ha-paneld-${GITHUB_REF_NAME}.apk"
          else
            echo "::warning::No signing secrets set — publishing the debug-signed APK."
            cp app/build/outputs/apk/debug/*.apk "dist/ha-paneld-${GITHUB_REF_NAME}-debug.apk"
          fi

      # Human-readable notes come from the matching CHANGELOG.md section; the auto-generated commit
      # list is appended below them by generate_release_notes. Keep CHANGELOG.md updated per release.
      - name: Extract release notes from CHANGELOG
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            /^## /{ if(found) exit; if(index($0, tag)){ found=1; next } }
            found
          ' CHANGELOG.md > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::warning::No CHANGELOG.md section for $GITHUB_REF_NAME — add one for human-readable notes."
            echo "_No changelog entry for $GITHUB_REF_NAME._" > release-body.md
          fi
          echo "----- release body -----"; cat release-body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body_path: release-body.md
          generate_release_notes: true
          # Tags with a suffix (e.g. v0.5.0-rc1) publish as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
