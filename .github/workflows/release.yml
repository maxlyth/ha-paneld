name: Release
run-name: Release ${{ github.ref_name }}

# Before tagging, run the pre-tag checklist in docs/RELEASING.md. Editorial release docs are manual:
# write the CHANGELOG.md section, refresh the README "Latest release" line, and move shipped items out
# of "Planned" in docs/roadmap.md. The dynamic README release badge follows GitHub releases.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Public releases fail closed unless all established signing credentials are available.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Require release signing credentials
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required; refusing to publish a debug-signed release asset."
              exit 1
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test installer and provisioning contracts
        run: scripts/tests/provision_test.sh

      - name: Run JVM tests and Android lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Sign release APK
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk)
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/keystore.jks" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/ha-paneld-release-signed.apk \
            "$UNSIGNED"

      - name: Collect release asset
        id: asset
        run: |
          mkdir -p dist
          test -s app/build/outputs/apk/release/ha-paneld-release-signed.apk
          apk_name="ha-paneld-${GITHUB_REF_NAME}-manual-setup-required.apk"
          cp app/build/outputs/apk/release/ha-paneld-release-signed.apk "dist/$apk_name"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Build release-pinned installer asset
        env:
          APK_NAME: ${{ steps.asset.outputs.apk_name }}
        run: |
          installer="dist/ha-paneld-installer-${GITHUB_REF_NAME}.sh"
          sed \
            -e "s|^RELEASE_TAG=.*|RELEASE_TAG=\"$GITHUB_REF_NAME\"|" \
            -e "s|^RELEASE_APK_NAME=.*|RELEASE_APK_NAME=\"$APK_NAME\"|" \
            scripts/install.sh > "$installer"
          chmod +x "$installer"
          bash -n "$installer"
          grep -Fq "RELEASE_TAG=\"$GITHUB_REF_NAME\"" "$installer"
          grep -Fq "RELEASE_APK_NAME=\"$APK_NAME\"" "$installer"

      # Human-readable notes come from the matching CHANGELOG.md section; the auto-generated commit
      # list is appended below them by generate_release_notes. Keep CHANGELOG.md updated per release.
      #
      # Section lookup — exact match first, base-version fallback:
      #   v0.8.4-rc3  →  look for "## v0.8.4-rc3"  (per-RC incremental notes)
      #   v0.8.4      →  look for "## v0.8.4"       (cumulative stable notes)
      # Each RC must have its own CHANGELOG section describing only what changed since
      # the previous RC — repeating the prior section causes identical release notes.
      - name: Extract release notes from CHANGELOG
        env:
          APK_NAME: ${{ steps.asset.outputs.apk_name }}
        run: |
          tag="$GITHUB_REF_NAME"
          base="${tag%%-*}"     # v0.8.4-rc3 → v0.8.4 (used only as fallback for stable)

          extract() {
            awk -v t="$1" '/^## /{ if(found) exit; if($2==t){ found=1; next } } found' CHANGELOG.md
          }

          extract "$tag" > release-body.md
          if [ ! -s release-body.md ] && [ "$tag" != "$base" ]; then
            echo "::error::No CHANGELOG.md section for $tag — each RC needs its own ## $tag entry describing what changed since the previous RC. Add it before tagging."
            exit 1
          fi
          if [ ! -s release-body.md ]; then
            extract "$base" > release-body.md
          fi
          if [ ! -s release-body.md ]; then
            echo "::warning::No CHANGELOG.md section for $tag — add one for human-readable notes."
            echo "_No changelog entry for $GITHUB_REF_NAME._" > release-body.md
          fi
          changelog_body="$(mktemp)"
          mv release-body.md "$changelog_body"
          cat > release-body.md <<EOF
          ## Recommended installation

          **Do not use \`adb install\` directly.** It installs the APK but does not complete ha-paneld's permissions, startup, configuration, and verification.

          From macOS, Linux, Git Bash, or WSL, run:

          \`\`\`sh
          curl -fsSL https://github.com/maxlyth/ha-paneld/releases/download/$GITHUB_REF_NAME/ha-paneld-installer-$GITHUB_REF_NAME.sh | bash
          \`\`\`

          The \`$APK_NAME\` asset is for manual or on-device sideloading. After installing it, open ha-paneld and complete the on-panel setup.

          EOF
          cat "$changelog_body" >> release-body.md
          echo "----- release body -----"; cat release-body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-body.md
          generate_release_notes: true
          # Tags with a suffix (e.g. v0.5.0-rc1) publish as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
