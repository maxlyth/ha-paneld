name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release dry run · {0}', inputs.release_tag) || format('Release {0}', github.ref_name) }}

# Before tagging, run the pre-tag checklist in docs/RELEASING.md. Editorial release docs are manual:
# write the CHANGELOG.md section, refresh the README "Latest release" line, and move shipped items out
# of "Planned" in docs/roadmap.md. The dynamic README release badge follows GitHub releases.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Candidate vX.Y.Z or vX.Y.Z-suffix used to validate release inputs without publishing
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      checks: read
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag and source commit
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release tag is not an accepted vX.Y.Z or vX.Y.Z-suffix version: $RELEASE_TAG"
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::Candidate release tag is not a valid Git tag ref: $RELEASE_TAG"
            exit 1
          fi
          source_commit=$(git rev-parse HEAD)
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checked-out source did not resolve to one commit."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main'
            if ! git merge-base --is-ancestor "$source_commit" refs/remotes/origin/main; then
              echo "::error::Release tag $RELEASE_TAG points to $source_commit, which is not on origin/main."
              exit 1
            fi
          fi
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android build toolchain
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Test privileged helper boundaries and app contract
        run: make -C helper clean test contract

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Test installer and provisioning contracts
        env:
          PROVISION_TEST_SCOPE: core
        run: |
          scripts/tests/provision_test.sh
          scripts/tests/consumer_docs_test.sh

      - name: Test release workflow contracts
        run: scripts/tests/release_workflow_test.sh

      - name: Run JVM tests and Android lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --stacktrace

      # Keep the security gate after local verification so the separately-triggered CodeQL workflow
      # can run concurrently. Publication still requires this job and therefore cannot bypass it.
      - name: Require clean security analysis for the source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          languages=(actions c-cpp java-kotlin javascript-typescript python)
          max_attempts=60
          sleep_seconds=10
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_COMMIT/check-runs?per_page=100")"
            pending=()
            for language in "${languages[@]}"; do
              name="CodeQL · $language"
              conclusion="$(jq -r --arg name "$name" \
                '[.check_runs[] | select(.name == $name)] | first | .conclusion // "pending"' <<<"$checks")"
              case "$conclusion" in
                success) ;;
                failure|cancelled|timed_out|action_required)
                  echo "::error::Required $name check for $SOURCE_COMMIT completed as $conclusion."
                  exit 1
                  ;;
                *) pending+=("$name ($conclusion)") ;;
              esac
            done
            if [ "${#pending[@]}" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Timed out waiting for CodeQL on $SOURCE_COMMIT: ${pending[*]}."
              exit 1
            fi
            echo "Waiting for CodeQL (${attempt}/${max_attempts}): ${pending[*]}"
            sleep "$sleep_seconds"
          done
          open_alerts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&per_page=100" \
            --jq '[.[] | select(.tool.name == "CodeQL")] | length' | awk '{ total += $1 } END { print total + 0 }')"
          if [ "$open_alerts" -ne 0 ]; then
            echo "::error::$open_alerts open CodeQL alert(s) must be fixed or explicitly dismissed before releasing."
            exit 1
          fi

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      input-manifest-sha256: ${{ steps.manifest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release tag and source commit
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Release tag is not an accepted vX.Y.Z or vX.Y.Z-suffix version: $RELEASE_TAG"
            exit 1
          fi
          if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::Candidate release tag is not a valid Git tag ref: $RELEASE_TAG"
            exit 1
          fi
          source_commit=$(git rev-parse HEAD)
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checked-out source did not resolve to one commit."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main'
            if ! git merge-base --is-ancestor "$source_commit" refs/remotes/origin/main; then
              echo "::error::Release tag $RELEASE_TAG points to $source_commit, which is not on origin/main."
              exit 1
            fi
          fi
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"

      - name: Set up Node.js 20.18.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.18.1

      - name: Verify profile-editor dependency graph and bundle
        working-directory: tools/profile-editor
        run: |
          expected_npm=$(node -p 'require("./package.json").packageManager.split("@").at(-1)')
          test "$(npm --version)" = "$expected_npm"
          npm ci --ignore-scripts --audit=false --fund=false
          npm run check
          npm run sbom -- --output ../../release-input/profile-editor-runtime.cdx.json

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android build toolchain
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build root helper release assets
        run: |
          set -euo pipefail
          mkdir -p release-input
          toolchain="$ANDROID_HOME/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          sources=(helper/src/*.c)
          helper_build_id="$(helper/source-id.sh)"
          [[ "$helper_build_id" =~ ^[0-9a-f]{64}$ ]]
          echo "HELPER_BUILD_ID=$helper_build_id" >> "$GITHUB_ENV"
          "$toolchain/armv7a-linux-androideabi26-clang" -O2 -s -Ihelper/src \
            -DHAPANELD_BUILD_ID="\"$helper_build_id\"" \
            -o release-input/hapaneld-helper-armeabi-v7a "${sources[@]}"
          "$toolchain/aarch64-linux-android26-clang" -O2 -s -Ihelper/src \
            -DHAPANELD_BUILD_ID="\"$helper_build_id\"" \
            -o release-input/hapaneld-helper-arm64-v8a "${sources[@]}"
          test -s release-input/hapaneld-helper-armeabi-v7a
          test -s release-input/hapaneld-helper-arm64-v8a
          file release-input/hapaneld-helper-armeabi-v7a | grep -Fq 'ELF 32-bit'
          file release-input/hapaneld-helper-arm64-v8a | grep -Fq 'ELF 64-bit'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-provider: basic

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify standalone helpers match APK-bundled helpers
        run: |
          cmp release-input/hapaneld-helper-armeabi-v7a app/src/main/assets/hapaneld-helper-arm
          cmp release-input/hapaneld-helper-arm64-v8a app/src/main/assets/hapaneld-helper-arm64

      - name: Generate release dependency SBOM
        run: ./gradlew :app:cyclonedxDirectBom --stacktrace

      - name: Collect unsigned release inputs
        run: |
          mkdir -p release-input
          mapfile -t unsigned_apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print)
          if [ "${#unsigned_apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one unsigned release APK, found ${#unsigned_apks[@]}."
            exit 1
          fi
          cp "${unsigned_apks[0]}" release-input/ha-paneld-unsigned.apk
          metadata=app/build/outputs/apk/release/output-metadata.json
          test -s "$metadata"
          application_id=$(node -e 'const m=require("./"+process.argv[1]); process.stdout.write(m.applicationId || "")' "$metadata")
          version_name=$(node -e 'const m=require("./"+process.argv[1]); const e=m.elements || []; process.stdout.write(e.length === 1 ? (e[0].versionName || "") : "")' "$metadata")
          expected_version_name="${RELEASE_TAG#v}"
          if [ "$application_id" != "io.github.maxlyth.hapaneld" ]; then
            echo "::error::Unsigned APK package is '$application_id', expected 'io.github.maxlyth.hapaneld'."
            exit 1
          fi
          if [ "$version_name" != "$expected_version_name" ]; then
            echo "::error::Unsigned APK versionName is '$version_name', expected '$expected_version_name' from the candidate release tag."
            exit 1
          fi
          test -s app/build/reports/cyclonedx-direct/bom.json
          cp app/build/reports/cyclonedx-direct/bom.json release-input/android-gradle-runtime.cdx.json
          apk_name="ha-paneld-${RELEASE_TAG}-manual-setup-required.apk"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"

      - name: Build release-pinned installer asset
        run: |
          installer="release-input/ha-paneld-installer-${RELEASE_TAG}.sh"
          provisioner="release-input/ha-paneld-provision-${RELEASE_TAG}.sh"
          sed \
            -e "s|^RELEASE_HELPER_BUILD_ID=.*|RELEASE_HELPER_BUILD_ID=\"$HELPER_BUILD_ID\"|" \
            scripts/provision.sh > "$provisioner"
          chmod +x "$provisioner"
          bash -n "$provisioner"
          sed \
            -e "s|^RELEASE_TAG=.*|RELEASE_TAG=\"$RELEASE_TAG\"|" \
            -e "s|^RELEASE_APK_NAME=.*|RELEASE_APK_NAME=\"$APK_NAME\"|" \
            -e "s|^PROVISION_COMMIT=.*|PROVISION_COMMIT=\"$SOURCE_COMMIT\"|" \
            scripts/install.sh > "$installer"
          chmod +x "$installer"
          bash -n "$installer"
          grep -Fq "RELEASE_TAG=\"$RELEASE_TAG\"" "$installer"
          grep -Fq "RELEASE_APK_NAME=\"$APK_NAME\"" "$installer"
          grep -Fq "PROVISION_COMMIT=\"$SOURCE_COMMIT\"" "$installer"
          grep -Fq "RELEASE_HELPER_BUILD_ID=\"$HELPER_BUILD_ID\"" "$provisioner"

      # Human-readable notes come only from the matching CHANGELOG.md section, keeping the approved
      # consumer-facing body exact for both prereleases and stable releases.
      #
      # Section lookup — exact match first, base-version fallback:
      #   v0.8.4-rc3  →  look for "## v0.8.4-rc3"  (per-RC incremental notes)
      #   v0.8.4      →  look for "## v0.8.4"       (cumulative stable notes)
      # Each RC must have its own CHANGELOG section describing only what changed since
      # the previous RC — repeating the prior section causes identical release notes.
      - name: Extract release notes from CHANGELOG
        run: |
          tag="$RELEASE_TAG"
          base="${tag%%-*}"     # v0.8.4-rc3 → v0.8.4 (used only as fallback for stable)

          extract() {
            awk -v t="$1" '/^## /{ if(found) exit; if($2==t){ found=1; next } } found' CHANGELOG.md
          }

          extract "$tag" > release-input/release-body.md
          if [ ! -s release-input/release-body.md ] && [ "$tag" != "$base" ]; then
            echo "::error::No CHANGELOG.md section for $tag — each RC needs its own ## $tag entry describing what changed since the previous RC. Add it before tagging."
            exit 1
          fi
          if [ ! -s release-input/release-body.md ]; then
            extract "$base" > release-input/release-body.md
          fi
          if [ ! -s release-input/release-body.md ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::error::No CHANGELOG.md section for stable release $tag. Add an exact ## $tag entry before tagging."
              exit 1
            fi
            echo "::warning::Dry run has no CHANGELOG.md section for stable candidate $tag."
            echo "_No changelog entry for $RELEASE_TAG._" > release-input/release-body.md
          fi
          changelog_body="$(mktemp)"
          mv release-input/release-body.md "$changelog_body"
          cat > release-input/release-body.md <<EOF
          ## Recommended installation

          **Do not use \`adb install\` directly.** It installs the APK but does not complete ha-paneld's permissions, startup, configuration, and verification.

          From macOS, Linux, Git Bash, or WSL, run:

          \`\`\`sh
          curl -fsSL https://github.com/maxlyth/ha-paneld/releases/download/$RELEASE_TAG/ha-paneld-installer-$RELEASE_TAG.sh | bash
          \`\`\`

          The \`$APK_NAME\` asset is for manual or on-device sideloading. After installing it, open ha-paneld and complete the on-panel setup.

          EOF
          cat "$changelog_body" >> release-input/release-body.md
          echo "----- release body -----"; cat release-input/release-body.md

      - name: Seal exact release inputs
        id: manifest
        run: |
          expected=$(printf '%s\n' \
            android-gradle-runtime.cdx.json \
            "ha-paneld-installer-${RELEASE_TAG}.sh" \
            "ha-paneld-provision-${RELEASE_TAG}.sh" \
            ha-paneld-unsigned.apk \
            hapaneld-helper-arm64-v8a \
            hapaneld-helper-armeabi-v7a \
            profile-editor-runtime.cdx.json \
            release-body.md)
          actual=$(find release-input -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release input set is not exact."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          (
            cd release-input
            sha256sum android-gradle-runtime.cdx.json "ha-paneld-installer-${RELEASE_TAG}.sh" "ha-paneld-provision-${RELEASE_TAG}.sh" ha-paneld-unsigned.apk hapaneld-helper-arm64-v8a hapaneld-helper-armeabi-v7a profile-editor-runtime.cdx.json release-body.md > MANIFEST.sha256
          )
          sha256=$(sha256sum release-input/MANIFEST.sha256 | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload sealed release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ha-paneld-release-input-${{ github.run_id }}
          path: release-input/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          include-hidden-files: false

  sign-and-publish:
    if: github.event_name == 'push'
    needs: [verify, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download sealed release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ha-paneld-release-input-${{ github.run_id }}
          path: release-input

      - name: Verify exact release inputs
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.package.outputs.input-manifest-sha256 }}
        run: |
          if [[ ! "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Build job did not provide a valid release-input manifest digest."
            exit 1
          fi
          actual_manifest_sha256=$(sha256sum release-input/MANIFEST.sha256 | cut -d' ' -f1)
          if [ "$actual_manifest_sha256" != "$EXPECTED_MANIFEST_SHA256" ]; then
            echo "::error::Downloaded release-input manifest does not match the build job output."
            exit 1
          fi
          expected=$(printf '%s\n' \
            MANIFEST.sha256 \
            android-gradle-runtime.cdx.json \
            "ha-paneld-installer-${RELEASE_TAG}.sh" \
            "ha-paneld-provision-${RELEASE_TAG}.sh" \
            ha-paneld-unsigned.apk \
            hapaneld-helper-arm64-v8a \
            hapaneld-helper-armeabi-v7a \
            profile-editor-runtime.cdx.json \
            release-body.md)
          actual=$(find release-input -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Downloaded release input set is not exact."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          (cd release-input && sha256sum --check MANIFEST.sha256)

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android Build-Tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Reverify release inputs after tool setup
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.package.outputs.input-manifest-sha256 }}
        run: |
          test "$(sha256sum release-input/MANIFEST.sha256 | cut -d' ' -f1)" = "$EXPECTED_MANIFEST_SHA256"
          (cd release-input && sha256sum --check MANIFEST.sha256)

      - name: Sign and authenticate release APK
        id: asset
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required; refusing to publish a debug-signed release asset."
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/release-keystore"
          pkcs12="$RUNNER_TEMP/release-signing.p12"
          private_key="$RUNNER_TEMP/release-signing-key.pem"
          public_key="$RUNNER_TEMP/release-signing-public.pem"
          trap 'rm -f "$keystore" "$pkcs12" "$private_key" "$public_key"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          unsigned_apk=release-input/ha-paneld-unsigned.apk
          apk_name="ha-paneld-${RELEASE_TAG}-manual-setup-required.apk"
          android_sbom_name="ha-paneld-${RELEASE_TAG}-android-gradle-runtime.cdx.json"
          profile_editor_sbom_name="ha-paneld-${RELEASE_TAG}-profile-editor-runtime.cdx.json"
          provisioner_name="ha-paneld-provision-${RELEASE_TAG}.sh"
          helper_arm_name="ha-paneld-helper-${RELEASE_TAG}-armeabi-v7a"
          helper_arm64_name="ha-paneld-helper-${RELEASE_TAG}-arm64-v8a"
          signed_apk="dist/$apk_name"
          mkdir -p dist

          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$signed_apk" \
            "$unsigned_apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$signed_apk"
          "$build_tools/zipalign" -c -P 16 4 "$signed_apk"

          badging=$("$build_tools/aapt" dump badging "$signed_apk")
          package_line=${badging%%$'\n'*}
          package_name=$(printf '%s\n' "$package_line" | sed -n "s/.* name='\([^']*\)'.*/\1/p")
          version_name=$(printf '%s\n' "$package_line" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")
          expected_version_name="${RELEASE_TAG#v}"
          if [ "$package_name" != "io.github.maxlyth.hapaneld" ]; then
            echo "::error::Signed APK package is '$package_name', expected 'io.github.maxlyth.hapaneld'."
            exit 1
          fi
          if [ "$version_name" != "$expected_version_name" ]; then
            echo "::error::Signed APK versionName is '$version_name', expected '$expected_version_name' from the tag."
            exit 1
          fi

          mapfile -t signer_digests < <("$build_tools/apksigner" verify --print-certs "$signed_apk" | sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p')
          if [ "${#signer_digests[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one APK signer, found ${#signer_digests[@]}."
            exit 1
          fi
          signer_digest=$(printf '%s' "${signer_digests[0]}" | tr '[:upper:]' '[:lower:]')
          expected_signer_digest=ac6193307fb0b70113aae205d7549406f96e063bc5491b67b1d5694a34b0e339
          if [ "$signer_digest" != "$expected_signer_digest" ]; then
            echo "::error::Signed APK certificate SHA-256 is '$signer_digest', expected '$expected_signer_digest'."
            exit 1
          fi

          cp release-input/android-gradle-runtime.cdx.json "dist/$android_sbom_name"
          cp release-input/profile-editor-runtime.cdx.json "dist/$profile_editor_sbom_name"
          cp "release-input/ha-paneld-installer-${RELEASE_TAG}.sh" "dist/ha-paneld-installer-${RELEASE_TAG}.sh"
          cp "release-input/$provisioner_name" "dist/$provisioner_name"
          cp release-input/hapaneld-helper-armeabi-v7a "dist/$helper_arm_name"
          cp release-input/hapaneld-helper-arm64-v8a "dist/$helper_arm64_name"
          chmod +x "dist/ha-paneld-installer-${RELEASE_TAG}.sh"
          chmod +x "dist/$provisioner_name"
          chmod +x "dist/$helper_arm_name" "dist/$helper_arm64_name"
          (cd dist && sha256sum "$apk_name" > "$apk_name.sha256")
          (cd dist && sha256sum "$provisioner_name" > "$provisioner_name.sha256")
          (cd dist && sha256sum "$helper_arm_name" > "$helper_arm_name.sha256")
          (cd dist && sha256sum "$helper_arm64_name" > "$helper_arm64_name.sha256")

          pkcs12_password=$(openssl rand -hex 32)
          keytool -importkeystore \
            -srckeystore "$keystore" \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore "$pkcs12" \
            -deststoretype PKCS12 \
            -deststorepass "$pkcs12_password" \
            -destkeypass "$pkcs12_password" \
            -noprompt
          openssl pkcs12 -in "$pkcs12" -passin "pass:$pkcs12_password" -nocerts -nodes -out "$private_key"
          chmod 600 "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$public_key"
          release_key_digest=$(openssl pkey -pubin -in "$public_key" -outform DER | sha256sum | cut -d' ' -f1)
          for trust_asset in \
            "release-input/ha-paneld-installer-${RELEASE_TAG}.sh" \
            "release-input/$provisioner_name"; do
            embedded_key="$RUNNER_TEMP/$(basename "$trust_asset").public.pem"
            awk '/^-----BEGIN PUBLIC KEY-----$/{copy=1} copy{print} /^-----END PUBLIC KEY-----$/{exit}' \
              "$trust_asset" > "$embedded_key"
            embedded_key_digest=$(openssl pkey -pubin -in "$embedded_key" -outform DER | sha256sum | cut -d' ' -f1)
            if [ "$embedded_key_digest" != "$release_key_digest" ]; then
              echo "::error::Embedded release key in $(basename "$trust_asset") does not match the signing keystore."
              exit 1
            fi
          done
          openssl dgst -sha256 -sign "$private_key" -out "dist/$apk_name.sha256.sig" "dist/$apk_name.sha256"
          openssl dgst -sha256 -verify "$public_key" -signature "dist/$apk_name.sha256.sig" "dist/$apk_name.sha256"
          openssl dgst -sha256 -sign "$private_key" -out "dist/$provisioner_name.sha256.sig" "dist/$provisioner_name.sha256"
          openssl dgst -sha256 -verify "$public_key" -signature "dist/$provisioner_name.sha256.sig" "dist/$provisioner_name.sha256"
          for helper_name in "$helper_arm_name" "$helper_arm64_name"; do
            openssl dgst -sha256 -sign "$private_key" -out "dist/$helper_name.sha256.sig" "dist/$helper_name.sha256"
            openssl dgst -sha256 -verify "$public_key" -signature "dist/$helper_name.sha256.sig" "dist/$helper_name.sha256"
          done

          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "android_sbom_name=$android_sbom_name" >> "$GITHUB_OUTPUT"
          echo "profile_editor_sbom_name=$profile_editor_sbom_name" >> "$GITHUB_OUTPUT"

      - name: Attest release asset provenance
        continue-on-error: true
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/*

      - name: Attest Android and Gradle runtime SBOM
        continue-on-error: true
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/${{ steps.asset.outputs.apk_name }}
          sbom-path: dist/${{ steps.asset.outputs.android_sbom_name }}

      - name: Attest profile-editor runtime SBOM
        continue-on-error: true
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/${{ steps.asset.outputs.apk_name }}
          sbom-path: dist/${{ steps.asset.outputs.profile_editor_sbom_name }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ env.RELEASE_TAG }}
          files: dist/*
          body_path: release-input/release-body.md
          # Tags with a suffix (e.g. v0.5.0-rc1) publish as pre-releases.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
