name: OpenSSF Scorecard
run-name: OpenSSF Scorecard · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Preserve Scorecard results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssf-scorecard-sarif
          path: results.sarif
          if-no-files-found: error
          retention-days: 5

  summary:
    needs: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Download Scorecard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openssf-scorecard-sarif

      - name: Summarize repository posture
        shell: bash
        run: |
          {
            echo "## OpenSSF Scorecard posture report"
            echo
            echo "Scorecard measures repository and supply-chain practices. Its diagnostics are kept separate from actionable code, dependency, and secret-scanning alerts."
            echo
            jq -r '.runs[].results[]? | "- **\(.ruleId | sub("ID$"; ""))** — \(.message.text | split("\n")[0])"' results.sarif
          } >> "$GITHUB_STEP_SUMMARY"
