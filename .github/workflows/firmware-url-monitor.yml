name: Firmware URL monitor
run-name: Firmware URL monitor · ${{ github.event_name }}

# Once a day, range-GET every firmware URL published in Discussion #7 and
# rewrite the post with a 7-day up/down sparkline per row. The rolling history
# lives on a dedicated `firmware-status` data branch (append-only) so the main
# branch history stays clean. If the daily probe finds any URLs unreachable, a
# second check runs automatically 1 hour later to distinguish transient blips
# from real outages.

on:
  schedule:
    - cron: "23 8 * * *"   # daily at 08:23 UTC, off the hour to dodge congestion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-url-monitor
  cancel-in-progress: false

env:
  DISCUSSION_NUMBER: "7"

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # push the firmware-status history branch
    outputs:
      has_failures: ${{ steps.probe.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Pull the previous 7-day window from the data branch. Absent on first run.
      - name: Restore history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$repo_url" firmware-status >/dev/null 2>&1; then
            git fetch -q "$repo_url" firmware-status
            git show FETCH_HEAD:history.json > history.json
          else
            echo '{"samples":[]}' > history.json
          fi

      - name: Probe firmware URLs
        id: probe
        continue-on-error: true
        run: python tools/firmware-index/firmware_index.py probe --history history.json

      - name: Render Discussion body
        id: render
        continue-on-error: true
        run: python tools/firmware-index/firmware_index.py render --history history.json --out body.md

      # The built-in GITHUB_TOKEN is a GitHub App integration token, which GitHub
      # forbids from the updateDiscussion GraphQL mutation ("Resource not
      # accessible by integration") regardless of the discussions: write
      # permission. Discussion writes need a user PAT — set a fine-grained token
      # (Discussions: Read and write on this repo) as the DISCUSSIONS_TOKEN secret.
      - name: Update Discussion body
        id: discussion
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DISCUSSIONS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::DISCUSSIONS_TOKEN secret not set — skipping the Discussion update."
            echo "Create a fine-grained PAT (Discussions: Read and write on this repo) and add it"
            echo "as the DISCUSSIONS_TOKEN Actions secret to go live. History still accumulates."
            exit 0
          fi
          owner="${GITHUB_REPOSITORY%/*}"; name="${GITHUB_REPOSITORY#*/}"
          did=$(gh api graphql \
            -f query='query($o:String!,$n:String!,$num:Int!){repository(owner:$o,name:$n){discussion(number:$num){id}}}' \
            -f o="$owner" -f n="$name" -F num="${DISCUSSION_NUMBER}" \
            --jq '.data.repository.discussion.id')
          test -n "$did" || { echo "could not resolve discussion #${DISCUSSION_NUMBER}"; exit 1; }
          gh api graphql \
            -f query='mutation($id:ID!,$b:String!){updateDiscussion(input:{discussionId:$id,body:$b}){discussion{url updatedAt}}}' \
            -f id="$did" -F b=@body.md

      # Append the new sample to the data branch. Never force-pushes: it commits
      # onto the existing tip (or creates the branch on first run).
      - name: Persist history
        id: persist
        if: always() && hashFiles('history.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="$(mktemp -d)"
          if git ls-remote --exit-code --heads "$repo_url" firmware-status >/dev/null 2>&1; then
            git clone -q --depth 1 --branch firmware-status "$repo_url" "$work"
          else
            git init -q "$work"
          fi
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp history.json "$work/history.json"
          git -C "$work" add history.json
          git -C "$work" commit -q -m "data: firmware URL availability $(date -u +%FT%TZ)" || { echo "no change"; exit 0; }
          git -C "$work" push -q "$repo_url" HEAD:firmware-status

      # A failed URL probe is retried below, so that job owns the final status.
      # If the URLs were healthy, any failed side effect is immediately fatal.
      - name: Report initial failures
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
          DISCUSSION_OUTCOME: ${{ steps.discussion.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        run: |
          failed=0
          if [ "$RENDER_OUTCOME" = "failure" ]; then
            echo "::error::The firmware Discussion body could not be rendered."
            failed=1
          fi
          if [ "$DISCUSSION_OUTCOME" = "failure" ]; then
            echo "::error::Discussion #${DISCUSSION_NUMBER} could not be updated."
            failed=1
          fi
          if [ "$PERSIST_OUTCOME" = "failure" ]; then
            echo "::error::The firmware availability sample could not be preserved."
            failed=1
          fi
          if [ "$PROBE_OUTCOME" = "failure" ]; then
            if [ "$failed" -ne 0 ]; then
              echo "::notice::Initial side-effect failures will be retried with the URL probe."
            fi
            exit 0
          fi
          exit "$failed"

  # If any URLs were unreachable, wait 1 hour and re-probe. This distinguishes a
  # transient CDN blip (back up on retry) from a real outage (still down). The
  # retry becomes that UTC day's final sparkline point, then updates the Discussion.
  retry:
    needs: check
    if: always() && needs.check.outputs.has_failures == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # push the retry sample to firmware-status
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Wait 1 hour before retry
        run: sleep 3600

      - name: Restore history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$repo_url" firmware-status >/dev/null 2>&1; then
            git fetch -q "$repo_url" firmware-status
            git show FETCH_HEAD:history.json > history.json
          else
            echo '{"samples":[]}' > history.json
          fi

      - name: Probe firmware URLs (retry)
        id: retry_probe
        continue-on-error: true
        run: python tools/firmware-index/firmware_index.py probe --history history.json

      - name: Render Discussion body
        id: retry_render
        continue-on-error: true
        run: python tools/firmware-index/firmware_index.py render --history history.json --out body.md

      - name: Update Discussion body
        id: retry_discussion
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DISCUSSIONS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::DISCUSSIONS_TOKEN secret not set — skipping the Discussion update."
            exit 0
          fi
          owner="${GITHUB_REPOSITORY%/*}"; name="${GITHUB_REPOSITORY#*/}"
          did=$(gh api graphql \
            -f query='query($o:String!,$n:String!,$num:Int!){repository(owner:$o,name:$n){discussion(number:$num){id}}}' \
            -f o="$owner" -f n="$name" -F num="${DISCUSSION_NUMBER}" \
            --jq '.data.repository.discussion.id')
          test -n "$did" || { echo "could not resolve discussion #${DISCUSSION_NUMBER}"; exit 1; }
          gh api graphql \
            -f query='mutation($id:ID!,$b:String!){updateDiscussion(input:{discussionId:$id,body:$b}){discussion{url updatedAt}}}' \
            -f id="$did" -F b=@body.md

      - name: Persist history
        id: retry_persist
        if: always() && hashFiles('history.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="$(mktemp -d)"
          if git ls-remote --exit-code --heads "$repo_url" firmware-status >/dev/null 2>&1; then
            git clone -q --depth 1 --branch firmware-status "$repo_url" "$work"
          else
            git init -q "$work"
          fi
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp history.json "$work/history.json"
          git -C "$work" add history.json
          git -C "$work" commit -q -m "data: firmware URL availability $(date -u +%FT%TZ) (retry)" || { echo "no change"; exit 0; }
          git -C "$work" push -q "$repo_url" HEAD:firmware-status

      - name: Report retry failures
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.retry_probe.outcome }}
          RENDER_OUTCOME: ${{ steps.retry_render.outcome }}
          DISCUSSION_OUTCOME: ${{ steps.retry_discussion.outcome }}
          PERSIST_OUTCOME: ${{ steps.retry_persist.outcome }}
        run: |
          failed=0
          if [ "$PROBE_OUTCOME" != "success" ]; then
            echo "::error::One or more firmware URLs remained unavailable after the one-hour retry."
            failed=1
          fi
          if [ "$RENDER_OUTCOME" = "failure" ]; then
            echo "::error::The retry Discussion body could not be rendered."
            failed=1
          fi
          if [ "$DISCUSSION_OUTCOME" = "failure" ]; then
            echo "::error::The retry sample was preserved, but Discussion #${DISCUSSION_NUMBER} could not be updated."
            failed=1
          fi
          if [ "$PERSIST_OUTCOME" = "failure" ]; then
            echo "::error::The retry availability sample could not be preserved."
            failed=1
          fi
          exit "$failed"
