[versions]
# Build toolchain — pinned to a conservative, well-documented combo for first-run CI
# reliability. Current stable as of 2026-06 is AGP 9.2 / Kotlin 2.3.x; bumping is a
# one-file change here and is fair game in the v0.x preview line. See README.
agp = "8.7.2"
kotlin = "2.0.21"
coreKtx = "1.13.1"
appcompat = "1.7.0"
# Ktor CIO server — coroutine-based, no Netty thread-per-connection. Hosts :8888.
ktor = "3.0.3"
# HiveMQ MQTT 5 client. NIO (pure-Java) transport => ABI-agnostic (covers Hall armeabi-v7a).
# Do NOT add the websocket module (AGP 8.2+ "No matching variant" bug) or epoll native transport.
hivemq = "1.3.3"
# JmDNS — cross-API-level mDNS advertise with TXT records (NsdManager TXT handling is weak).
jmdns = "3.5.9"
coroutines = "1.9.0"
slf4jAndroid = "1.7.36"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
hivemq-mqtt-client = { group = "com.hivemq", name = "hivemq-mqtt-client", version.ref = "hivemq" }
jmdns = { group = "org.jmdns", name = "jmdns", version.ref = "jmdns" }
slf4j-android = { group = "org.slf4j", name = "slf4j-android", version.ref = "slf4jAndroid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
