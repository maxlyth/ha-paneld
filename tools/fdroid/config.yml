# fdroidserver config for the ha-paneld self-hosted F-Droid repository.
#
# PUBLIC FIELDS ONLY — the signing keystore + passwords and the SDK path are injected at runtime by
# .github/workflows/fdroid.yml (reusing the same ANDROID_KEYSTORE_* secrets that sign the release APKs,
# so the repo index and the APKs share one identity). NEVER commit keystore material here.

repo_url: "https://fdroid.ha-paneld.com/fdroid/repo"
repo_name: "ha-paneld"
repo_description: >-
  RETIRED. This repository is no longer updated. It only ever installed the app and could not connect a
  panel to Home Assistant, so it has been replaced by the Panel Assistant integration for Home
  Assistant, which installs ha-paneld and connects the panel once the panel's own setup is done. See
  https://panel-assistant.io. The versions already published here stay available, and nothing on an
  installed panel stops working.

# Keep every published version available in the main repo (no archive split) — the repo is small.
archive_older: 0

# We publish prebuilt, already-signed release APKs (pulled from GitHub Releases); don't create the
# extra "current version" symlink, and don't try to source-build.
make_current_version_link: false
