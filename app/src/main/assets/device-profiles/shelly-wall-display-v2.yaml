schema: 2
id: shelly-wall-display-v2
version: 2.1.3
display_name: Shelly Wall Display (modern)
soc_class: "Model-dependent (known: RK3326-S / RK3566)"
metadata:
  author: ha-paneld maintainers
  source: https://github.com/maxlyth/ha-paneld/blob/main/docs/hardware/shelly-wall-display.md
  license: Apache-2.0
  maturity: experimental
  limitations:
    - SoC and proximity or motion details vary by model and still need live-hardware confirmation.
    - On-board relays are not exposed because no safe supported local control path is known.
requires:
  min_core_version: 0.9.5-rc1
  drivers:
    - screen.brightness-zero
    - sensor.android
match:
  # Match values are derived from the modern Shelly Wall Display firmware identity.
  priority: 500
  fallback: false
  any:
    - priority: 970
      all:
        - field: model
          op: equals
          values:
            - blake
            - jenna
            - cally
            - maverick
            - dayna
    - priority: 970
      all:
        - field: device
          op: equals
          values:
            - blake
            - jenna
            - cally
            - maverick
            - dayna
    - priority: 970
      all:
        - field: model
          op: starts_with
          values:
            - sawd-3
            - sawd-4
            - sawd-5
            - sawd-6
    - priority: 970
      all:
        - field: device
          op: starts_with
          values:
            - sawd-3
            - sawd-4
            - sawd-5
            - sawd-6
platform:
  # The application UID is sandboxed; privileged operations use the helper route.
  su_form: none
  app_can_su: false
  has_recents: true
hardware:
  led:
    mechanism: none
    transfer: identity
  screen_off: brightness-zero
  has_button_backlight: false
sensors:
  light_technology: Ambient light
  cht8305: false
  room_temp_offset_c: 0.0
identity:
  manufacturer: Shelly
  model: Wall Display
  model_label_strategy: display-name
input:
  evdev_buttons: []
cpu: {}
display: {}
provisioning:
  software: {}
  display: {}
  packages: []
  recipes: []
