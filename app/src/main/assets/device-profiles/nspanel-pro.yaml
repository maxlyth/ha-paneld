schema: 2
id: nspanel-pro
version: 2.0.2
display_name: Sonoff NSPanel Pro
soc_class: PX30 / rk3326
soc:
  model: Rockchip RK3326
  introduced_year: 2018
  cpu_cores:
    - architecture: Arm Cortex-A35
      count: 4
metadata:
  author: ha-paneld maintainers
  source: https://github.com/maxlyth/ha-paneld/blob/main/docs/hardware/nspanel-pro.md
  links:
    - label: SoC details
      url: https://www.rock-chips.com/a/en/News/Press_Releases/2018/0413/898.html
  license: Apache-2.0
  maturity: verified
  tested_firmware:
    - NSPanel 86P firmware before and after 3.0.0
    - NSPanel 120P firmware before and after 3.5.0
  limitations:
    - The NSPanel Pro Gen2 relay layout is not represented by this profile.
requires:
  min_core_version: 0.9.5-rc1
  drivers:
    - access.toolbox-su
    - radio.siliconlabs-host
    - screen.su-blpower
    - sensor.android
    - update.webview
match:
  priority: 500
  fallback: false
  any:
    # Observed Build.PRODUCT on NSPanel 86P/120P firmware images.
    - priority: 920
      all:
        - field: product_version
          op: starts_with
          values:
            - nspanel
            - s6_android_
    - priority: 910
      all:
        # PX30/rk3326 is the stable hardware-family fingerprint on these panels.
        - field: model
          op: contains
          values:
            - px30
            - rk3326
    - priority: 910
      all:
        - field: device
          op: contains
          values:
            - px30
            - rk3326
platform:
  # Confirmed on the stock NSPanel firmware: ha-paneld can invoke the toolbox su form.
  su_form: toolbox
  app_can_su: true
  has_recents: true
hardware:
  led:
    # NSPanel status LEDs are not exposed through the supported app-side LED routes.
    mechanism: none
    transfer: identity
  screen_off: su-blpower
  has_button_backlight: false
  touch_click_gain: 0.45
  zigbee_gateway_dir: /vendor/bin/siliconlabs_host
sensors:
  # These are the Android sensor capabilities observed on the NSPanel family.
  proximity_technology: Infrared
  light_technology: Ambient light
  cht8305: false
  room_temp_offset_c: 0.0
identity:
  manufacturer: Sonoff
  model: NSPanel Pro
  model_label_strategy: nspanel-product-version
input:
  evdev_buttons: []
cpu:
  governors:
    Performance: performance
    Efficiency: powersave
    Auto: interactive
display: {}
provisioning:
  software:
    webview:
      artifact: lineageos-138-arm
    companion:
      max_version: 2026.5.4
  display:
    density: nspanel-variant
    font_scale: 1.0
  packages:
    - package: com.eWeLinkControlPanel
      desired_state: disabled
      importance: recommended
      tags:
        - vendor
        - overlay
        - boot
      note: >-
        eWeLink/Sonoff control-panel app. After some Sonoff firmware updates it starts on boot and draws a
        floating widget over the dashboard.
    - package: com.android.rk
      desired_state: disabled
      importance: recommended
      tags:
        - chipset
        - test
      note: Rockchip (PX30 SoC) factory/test app left in the firmware image. Not used by the panel in normal operation.
    - package: android.rk.RockVideoPlayer
      desired_state: disabled
      importance: optional
      tags:
        - chipset
        - demo
      note: Rockchip demo video player bundled with the SoC image. Safe to disable unless you actually use it.
    - package: com.cghs.stresstest
      desired_state: disabled
      importance: recommended
      tags:
        - vendor
        - test
        - clutter
      note: >-
        Factory hardware stress-test ("burn-in") tool (app label "Stresstest for 8.1"). Used on the
        production line to soak the panel; not needed in normal operation.
    - package: com.smatek.test
      desired_state: disabled
      importance: recommended
      tags:
        - vendor
        - test
        - clutter
      note: >-
        CoolKit (eWeLink/Sonoff) factory test tool (label "测试工具" = "Test Tool"), bundled in /oem so it
        survives a factory reset. Diagnostic only — not used in normal operation.
    - package: com.rockchip.devicetest
      desired_state: disabled
      importance: recommended
      tags:
        - chipset
        - test
        - clutter
      note: Rockchip (PX30 SoC) factory device-test suite. Diagnostic only; not used by the panel in normal operation.
    - package: com.DeviceTest
      desired_state: disabled
      importance: recommended
      tags:
        - vendor
        - test
        - clutter
      note: >-
        Factory device-test app (privileged system, label "DeviceTest(android8.0)") left in the firmware
        image. Diagnostic only — not used in normal operation.
  recipes:
    - id: nspanel-pro.watchdog-e2big-repair
