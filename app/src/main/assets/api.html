<!doctype html><html lang="en"><head><meta charset="utf-8">
<script>/* ?theme=light|dark override, else the browser preference (prefers-color-scheme) */
(function(){var m=location.search.match(/[?&]theme=(dark|light)\b/);if(m)document.documentElement.setAttribute("data-theme",m[1])})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ha-paneld · REST API</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
 /* Theme-aware (matches the main UI): dark values are the original palette; light via the media query,
    with a ?theme= / data-theme override. The action blue, the GET/POST badges and the response <pre>
    stay theme-agnostic (terminal look), like the logs panel elsewhere. */
 :root{color-scheme:dark;--bg:#111;--text:#eee;--accent:#9af;--accent2:#9cf;--icon:#7c8a99;
   --border:#242424;--card:#181818;--input-bg:#1c1c1c;--border-strong:#444;--ok-dim:#8a8}
 @media (prefers-color-scheme:light){:root:not([data-theme=dark]){color-scheme:light;--bg:#f2f3f5;--text:#1b2430;
   --accent:#1e56a8;--accent2:#0b6a8e;--icon:#5b6b7a;--border:#d9dde3;--card:#fff;--input-bg:#f6f7f9;--border-strong:#b6bec8;--ok-dim:#3f7d49}}
 :root[data-theme=light]{color-scheme:light;--bg:#f2f3f5;--text:#1b2430;--accent:#1e56a8;--accent2:#0b6a8e;
   --icon:#5b6b7a;--border:#d9dde3;--card:#fff;--input-bg:#f6f7f9;--border-strong:#b6bec8;--ok-dim:#3f7d49}
 body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--text)}
 .wrap{max-width:900px;margin:0 auto;padding:20px}
 .hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
 h1{font-size:1.3rem;margin:0} h1 small{color:var(--accent);font-weight:400}
 a{color:var(--accent2)}
 h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--icon);margin:22px 0 8px;border-bottom:1px solid var(--border);padding-bottom:4px}
 .ep{background:var(--card);border:1px solid var(--border);border-radius:10px;margin:0 0 10px;overflow:hidden}
 summary{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;list-style:none}
 summary::-webkit-details-marker{display:none}
 .m{font-weight:700;font-size:.72rem;padding:3px 8px;border-radius:6px;min-width:46px;text-align:center}
 .get{background:#173d2a;color:#5ad18a} .post{background:#1b3a5c;color:#6db3ff}
 .path{font-family:ui-monospace,monospace;font-size:.92rem;color:var(--text)} .sum{color:var(--ok-dim);font-size:.85rem;margin-left:auto;text-align:right}
 .body{padding:0 14px 14px;border-top:1px solid var(--border)}
 label{display:block;font-size:.78rem;color:var(--accent);margin:10px 0 4px}
 input,select,textarea,button{font:inherit;font-size:.9rem;padding:7px 10px;border-radius:7px;border:1px solid var(--border-strong);background:var(--input-bg);color:var(--text);box-sizing:border-box;width:100%}
 textarea{min-height:54px;font-family:ui-monospace,monospace}
 button{background:#2557a7;border-color:#2557a7;color:#fff;cursor:pointer;width:auto;margin-top:12px}
 pre{background:#0d0d0d;border:1px solid var(--border);border-radius:7px;padding:10px;margin-top:10px;white-space:pre-wrap;word-break:break-word;font-size:.82rem;color:#cdd;max-height:300px;overflow:auto}
 .st{font-size:.78rem;margin-top:8px}
 .desc{color:var(--ok-dim);font-size:.82rem;margin:2px 0 0}
</style></head><body><div class="wrap">
<div class="hdr"><h1>ha-paneld <small>· REST API</small></h1><a href="/">← back to panel</a></div>
<p class="desc">Live, on-panel API explorer. <a href="/api/v1/openapi.json" target="_blank">openapi.json</a> — import into Swagger/Postman for fleet tooling. No auth; LAN only.</p>
<div id="root"></div>
<script>
fetch('/api/v1/openapi.json').then(function(r){return r.json();}).then(render).catch(function(e){
 document.getElementById('root').innerHTML='<p class="desc">Could not load /api/v1/openapi.json: '+e+'</p>';});

function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function requestBody(op){var c=op.requestBody&&op.requestBody.content;if(!c)return null;
 var preferred=['application/x-www-form-urlencoded','application/json','application/yaml','text/yaml','text/plain','application/octet-stream'];
 for(var i=0;i<preferred.length;i++)if(c[preferred[i]])return {type:preferred[i],schema:c[preferred[i]].schema||{}};
 var types=Object.keys(c);return types.length?{type:types[0],schema:c[types[0]].schema||{}}:null;}

function addInput(body,label,pr){body.appendChild(el('label',null,label+(pr.description?' <span style="color:#667;font-weight:400">— '+pr.description+'</span>':'')));
 var inp;if(pr.enum){inp=el('select');pr.enum.forEach(function(v){var o=el('option',null,v);o.value=v;inp.appendChild(o);});}
 else{inp=el('input');inp.type=(pr.format==='password'?'password':(pr.type==='number'||pr.type==='integer'?'number':'text'));inp.step='any';}
 body.appendChild(inp);return inp;}

function render(spec){
 var paths=spec.paths,groups={};
 Object.keys(paths).forEach(function(p){Object.keys(paths[p]).forEach(function(m){
  var op=paths[p][m],tag=(op.tags&&op.tags[0])||'other';(groups[tag]=groups[tag]||[]).push({p:p,m:m,op:op});});});
 var root=document.getElementById('root');
 Object.keys(groups).forEach(function(tag){
  root.appendChild(el('h2',null,tag));
  groups[tag].forEach(function(e){root.appendChild(endpoint(e.p,e.m,e.op));});
 });
}

function endpoint(path,method,op){
 var d=el('details','ep');
 var s=el('summary',null,'<span class="m '+method+'">'+method.toUpperCase()+'</span>'+
   '<span class="path">'+path+'</span><span class="sum">'+(op.summary||'')+'</span>');
 d.appendChild(s);
 var body=el('div','body');
 var fields={},parameters=[],request=requestBody(op);
 (op.parameters||[]).forEach(function(p){var pr=p.schema||{},req=p.required?' *':'';parameters.push({spec:p,input:addInput(body,p.name+req+' ('+p.in+')',{type:pr.type,format:pr.format,enum:pr.enum,description:p.description})});});
 if(request&&request.type==='application/x-www-form-urlencoded'&&request.schema.properties){Object.keys(request.schema.properties).forEach(function(k){
  var pr=request.schema.properties[k],req=(request.schema.required||[]).indexOf(k)>=0;
  fields[k]=addInput(body,k+(req?' *':''),pr);});}
 else if(request){
  body.appendChild(el('label',null,'request body ('+request.type+')'));
  if(request.type==='application/octet-stream'){var file=el('input');file.type='file';fields.__body=file;body.appendChild(file);}
  else{var ta=el('textarea');if(request.type==='application/json'&&request.schema.type==='object')ta.value='{}';fields.__body=ta;body.appendChild(ta);}
 }
 var btn=el('button',null,'Send '+method.toUpperCase());
 var st=el('div','st'),out=el('pre');out.style.display='none';
 body.appendChild(btn);body.appendChild(st);body.appendChild(out);
 btn.onclick=function(){send(path,method,fields,parameters,request,st,out,btn);};
 d.appendChild(body);return d;
}

function send(path,method,fields,parameters,request,st,out,btn){
 btn.disabled=true;st.textContent='…';out.style.display='none';
 var opts={method:method.toUpperCase(),headers:{}},query=[];
 parameters.forEach(function(p){var v=p.input.value;if(v==='')return;var where=p.spec.in,name=p.spec.name;
  if(where==='path')path=path.replace('{'+name+'}',encodeURIComponent(v));
  else if(where==='query')query.push(encodeURIComponent(name)+'='+encodeURIComponent(v));
  else if(where==='header')opts.headers[name]=v;});
 if(query.length)path+=(path.indexOf('?')>=0?'&':'?')+query.join('&');
 if(request&&request.type==='application/x-www-form-urlencoded'){
  var params=[];Object.keys(fields).forEach(function(k){var v=fields[k].value;if(v!=='')params.push(encodeURIComponent(k)+'='+encodeURIComponent(v));});
  if(params.length)opts.body=params.join('&');opts.headers['Content-Type']=request.type;}
 else if(request&&fields.__body){
  if(request.type==='application/octet-stream'){if(fields.__body.files&&fields.__body.files[0])opts.body=fields.__body.files[0];}
  else opts.body=fields.__body.value;
  opts.headers['Content-Type']=request.type;
 }
 var t0=Date.now();
 fetch(path,opts).then(function(r){return r.text().then(function(tx){
  st.innerHTML='<b style="color:'+(r.ok?'#5ad18a':'#d9534f')+'">'+r.status+'</b> '+(r.headers.get('content-type')||'')+' · '+(Date.now()-t0)+' ms';
  var body=tx;try{body=JSON.stringify(JSON.parse(tx),null,2);}catch(e){}
  out.textContent=body;out.style.display='';btn.disabled=false;});})
 .catch(function(e){st.innerHTML='<b style="color:#d9534f">error</b> '+e;btn.disabled=false;});
}
</script>
</div></body></html>
